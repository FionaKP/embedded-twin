name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Fetch FreeRTOS kernel (for the RTOS integration test)
        run: examples/freertos-blinky/fetch_kernel.sh
      - run: pytest -q
      - name: Run the example ringer via the CLI
        run: |
          cd examples/asset-tracker
          twin run scenarios/smoke_test.yaml scenarios/network_congestion.yaml -o out
